name: study-image

# Builds the experiment images. Manual only. Both conditions are built from one Dockerfile in one run.
# The tool commits are explicit inputs, so what runs is exactly those commits, not this branch's tip.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag prefix; produces <tag>-aperture and <tag>-opencode"
        required: true
        default: exp1
      aperture_sha:
        description: "Full Aperture commit"
        required: true
        default: d91560ad549c9b6c1238e1a06745ad03c12ad89b
      opencode_sha:
        description: "Full pristine OpenCode commit"
        required: true
        default: 400f0fb10082c7602290f86380896499be46db1f

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/agentstudy/study-env

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aperture, opencode]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/experiment/experiment.Dockerfile
          target: ${{ matrix.target }}
          push: true
          build-args: |
            APERTURE_SHA=${{ inputs.aperture_sha }}
            OPENCODE_SHA=${{ inputs.opencode_sha }}
          tags: ${{ env.IMAGE }}:${{ inputs.tag }}-${{ matrix.target }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record what was frozen
        run: |
          {
            echo "## ${{ inputs.tag }}-${{ matrix.target }}"
            echo "Aperture \`${{ inputs.aperture_sha }}\`, opencode \`${{ inputs.opencode_sha }}\`, scripts \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
